name: Build TypeIQ APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log

      - name: Save Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-failure-log
          tail -n 300 /tmp/gradle_build.log > GRADLE_ERROR.txt
          git add GRADLE_ERROR.txt
          git commit -m "ci: log build failure details"
          git push -f origin build-failure-log

      - name: Locate and Package APK
        run: |
          mkdir -p release-output
          find app/build -type f > /tmp/build_tree.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-tree
          cp /tmp/build_tree.txt BUILD_TREE.txt
          git add BUILD_TREE.txt
          git commit -m "debug: inspect build output files" || true
          git push -f origin debug-tree || true

          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" release-output/TypeIQ-v1.0.0-debug.apk
          else
            echo "Error: No APK file found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeIQ-debug-apk
          path: release-output/TypeIQ-v1.0.0-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-preview
          name: "TypeIQ v1.0.0 (Debug APK)"
          prerelease: true
          body: |
            ### 🚀 TypeIQ On-Device AI Keyboard
            
            Download and install the APK directly onto your Android device (Android 8.0+ / API 26+).
            
            #### 📱 Installation Steps:
            1. Tap `TypeIQ-v1.0.0-debug.apk` below on your phone.
            2. When prompted, allow "Install from this source" for your browser / file manager.
            3. Tap **Install** and open **TypeIQ**.
            4. Follow the in-app setup guide to enable TypeIQ in keyboard settings and choose it as your default keyboard.
          files: release-output/TypeIQ-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
